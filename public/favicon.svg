<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="anatobg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c81"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#anatobg)" />
  
  <!-- Outer subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />
  
  <!-- Central Icon (Caduceus + Shield + QR Check) -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    <!-- Microscope / Anatomy Laboratory Shield Symbol -->
    <path d="M256 90 L380 144 V260 C380 346 324 416 256 442 C188 416 132 346 132 260 V144 Z" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Inner Accent Shield -->
    <path d="M256 116 L356 160 V254 C356 326 312 386 256 410 C200 386 156 326 156 254 V160 Z" fill="#0f4c81" />
    
    <!-- Medical Cross with Rounded Ends -->
    <path d="M228 190 H284 V238 H332 V294 H284 V342 H228 V294 H180 V238 H228 Z" fill="#38bdf8" />
    
    <!-- Checkmark Overlay (Presence Confirmed) -->
    <circle cx="340" cy="336" r="54" fill="#10b981" stroke="#ffffff" stroke-width="8" />
    <path d="M318 336 L334 352 L364 322" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
