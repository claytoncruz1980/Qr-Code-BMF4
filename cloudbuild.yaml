steps:
  # 1. Instalação otimizada de dependências com cache local
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci', '--prefer-offline', '--no-audit']

  # 2. Compilação rápida e robusta do frontend (Vite) e backend (esbuild)
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']

  # 3. Construção otimizada da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloudrun--bmf4/app:$COMMIT_SHA', '.']

  # 4. Envio rápido para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloudrun--bmf4/app:$COMMIT_SHA']

  # 5. Deploy fluido e otimizado no Cloud Run na região de São Paulo (southamerica-east1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'controle-de-presenca'
      - '--image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloudrun--bmf4/app:$COMMIT_SHA'
      - '--region=southamerica-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production,PORT=8080'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--timeout=300'

images:
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloudrun--bmf4/app:$COMMIT_SHA'
